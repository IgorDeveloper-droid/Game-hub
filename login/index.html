<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tela de login do Game Hub">
    <title>Game Hub | Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand-mark" aria-hidden="true">+</div>
            <p class="eyebrow">GAME HUB</p>
            <h1 id="login-title">Entre na sua conta</h1>
            <p class="subtitle">Acesse seus jogos e continue de onde parou.</p>

            <form id="loginForm" novalidate>
                <div class="field-group">
                    <label for="username">Usuário ou e-mail</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                    <small class="field-error" id="usernameError"></small>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" id="forgotPassword">Esqueci minha senha</a>
                    </div>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" autocomplete="current-password" minlength="6" required>
                        <button type="button" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
                    </div>
                    <small class="field-error" id="passwordError"></small>
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="remember" value="1">
                    <span>Lembrar de mim</span>
                </label>

                <button class="submit-button" type="submit">Entrar</button>
                <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="signup-text">Ainda não tem uma conta? <a href="../cadastro/index.html">Criar conta</a></p>
        </section>
    </main>
</body>
</html>
