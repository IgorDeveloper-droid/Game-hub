<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub | Cadastro</title>
    <link rel="stylesheet" href="../login/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="login-card" aria-labelledby="signup-title">
            <div class="brand-mark" aria-hidden="true">+</div>
            <p class="eyebrow">GAME HUB</p>
            <h1 id="signup-title">Crie sua conta</h1>
            <p class="subtitle">Monte seu perfil e organize seus jogos.</p>

            <form id="signupForm" novalidate>
                <div class="field-group">
                    <label for="username">Usuário ou e-mail</label>
                    <input type="text" id="username" autocomplete="username" required>
                    <small class="field-error" id="usernameError"></small>
                </div>
                <div class="field-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" autocomplete="new-password" minlength="6" required>
                    <small class="field-error" id="passwordError"></small>
                </div>
                <div class="field-group">
                    <label for="confirmPassword">Confirme sua senha</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" required>
                    <small class="field-error" id="confirmPasswordError"></small>
                </div>
                <button class="submit-button" type="submit">Criar conta</button>
                <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
            </form>
            <p class="signup-text">Já tem uma conta? <a href="../login/index.html">Entrar</a></p>
        </section>
    </main>
</body>
</html>
